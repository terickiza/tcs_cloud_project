# .azure-pipelines/azure-pipelines.yaml
trigger:
  branches:
    include:
      - main
      - master

parameters:
  - name: environment
    displayName: Entorno
    type: string
    default: dev
    values: [dev, qa, prod]

variables:
  # Grupo de variables en Azure DevOps (Library). Debe contener, como variables
  # secretas:  ARM_SUBSCRIPTION_ID  y  TF_VAR_expected_api_key
  # Nunca poner GUIDs de suscripción ni secretos literales en este archivo.
  - group: terraform-${{ parameters.environment }}
  - name: TF_WORKING_DIR
    value: './terraform/0-dev/'
  - name: AZURE_SERVICE_CONNECTION
    value: 'azure-dev'

resources:
  containers:
    - container: dockerterraform
      image: acrdevopslabdev01.azurecr.io/terraform-azcli:latest
      endpoint: 'srv-conn-iac-docker'
      options: '--user 0 --entrypoint ""'
      env:
        TF_IN_AUTOMATION: 'true'

stages:
  - stage: Validate
    displayName: "Validate Terraform"
    jobs:
      - job: validate
        displayName: "Terraform fmt, init, validate"
        pool: { name: Default }
        container: dockerterraform
        steps:
          - checkout: self
            clean: true

          - task: Bash@3
            displayName: "Mostrar versión de Terraform"
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                terraform -version

          - task: AzureCLI@2
            displayName: "Terraform fmt, init, validate (Azure CLI auth)"
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                # La suscripción la fija el service connection; solo verificamos.
                echo "Suscripción actual:"
                az account show --query id -o tsv

                cd "$(TF_WORKING_DIR)"

                terraform fmt -check -diff
                terraform init -input=false -reconfigure
                terraform validate

  - stage: Plan
    displayName: "Plan Terraform"
    dependsOn: Validate
    jobs:
      - job: plan
        displayName: "Terraform plan y publicar artefacto"
        pool: { name: Default }
        container: dockerterraform
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: "Terraform init & plan (Azure CLI auth)"
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                echo "Suscripción actual:"
                az account show --query id -o tsv

                cd "$(TF_WORKING_DIR)"

                terraform init -input=false
                terraform plan \
                  -out="$(Build.ArtifactStagingDirectory)/tfplan-$(environment).bin" \
                  -input=false \
                  -no-color
            env:
              TF_VAR_expected_api_key: $(TF_VAR_expected_api_key)

          - task: PublishPipelineArtifact@1
            displayName: "Publicar artefacto: tfplan"
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)"
              artifactName: "tfplan-$(environment)"

  - stage: Apply
    displayName: "Apply Terraform (con aprobación manual)"
    dependsOn: Plan
    condition: succeeded('Plan')
    jobs:
      # 'deployment' + 'environment' habilita approvals/checks en Azure DevOps.
      # Configurar en:  Pipelines > Environments > terraform-<env> > Approvals and checks.
      - deployment: apply
        displayName: "Aplicar plan terraform"
        pool: { name: Default }
        container: dockerterraform
        environment: "terraform-$(environment)"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: "tfplan-$(environment)"

                - task: AzureCLI@2
                  displayName: "Terraform init & apply (plan guardado)"
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      echo "Suscripción actual:"
                      az account show --query id -o tsv

                      cd "$(TF_WORKING_DIR)"

                      terraform init -input=false
                      # Aplica exactamente el plan aprobado; no re-planifica.
                      terraform apply -input=false -no-color \
                        "$(Pipeline.Workspace)/tfplan-$(environment)/tfplan-$(environment).bin"
                  env:
                    TF_VAR_expected_api_key: $(TF_VAR_expected_api_key)
