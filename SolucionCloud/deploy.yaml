
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devops-api-sa
  namespace: default
imagePullSecrets:
- name: acr-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-api
  template:
    metadata:
      labels:
        app: devops-api
    spec:
      serviceAccountName: devops-api-sa

      nodeSelector:
        kubernetes.azure.com/agentpool: poolapps

      containers:
      - name: devops-api
        image: acrdevopslabdev01.azurecr.io/devops-api:node22
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20